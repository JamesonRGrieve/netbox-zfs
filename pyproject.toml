# SPDX-License-Identifier: AGPL-3.0-or-later
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-zfs"
version = "0.1.0"
description = "Native NetBox source of truth for ZFS pools, vdevs, datasets, and zvols"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Jameson" }]
keywords = ["netbox", "netbox-plugin", "zfs", "zpool", "vdev", "storage"]
# PEP 639: the SPDX `license` expression above is authoritative; a `License ::`
# classifier alongside it is rejected by setuptools>=77, so it is intentionally omitted.
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]
# netbox-zfs references netbox_fs.Partition as vdev members (cross-plugin FK + import).
dependencies = ["netbox-fs"]

[project.urls]
Repository = "https://github.com/JamesonRGrieve/netbox-zfs"

[tool.setuptools.packages.find]
include = ["netbox_zfs*"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netbox.settings"
python_files = ["test_*.py"]
addopts = "-v"
